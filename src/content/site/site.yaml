name: Johann Schnettker
studio: Humansize
email: schnettker.johann@gmail.com
intro: Johann Schnettker is the designer behind Humansize, a studio for websites, 3D work and spaces you can walk into.
timezone: Asia/Tokyo
place: Tokyo
about:
  - I design things people can look at, click through and walk into. That means 3D renders and artwork, websites I design and build in Framer, and physical retail spaces.
  - Around that I do branding, product prototyping and 3D printing, so I can take an idea from sketch to screen to a physical object without handing it off.
  - Before going independent as Humansize, I spent five years at Analogue and Build in Amsterdam working on sites for Tony's Chocolonely, Atomic, Suitsupply, Vitra, Mammut and Mollie, and building physical stores along the way.
  - "I like projects where the screen and the space meet: a brand's online home and the shop it opens, or a product shown in 3D before it exists."
  - Based in Tokyo until December, then back in Europe. Open to freelance projects and to the right studio.
