about:
  - >
    Humansize is the studio of Johann Schnettker. I design things you can look
    at, click through and walk into, like retail spaces, websites built in
    Framer, and 3D renders and artwork.
  - >
    Most projects move between all three. A brand gets its online home and the
    shop it opens, or a product is shown in 3D before it exists. Because I also
    do branding, prototyping and 3D printing, an idea can go from sketch to
    screen to object in one pair of hands.
  - >
    Before starting Humansize I spent five years at Analogue and Build in
    Amsterdam. There I worked on sites for Tony's Chocolonely,
    [Atomic](/work/atomic/), Suitsupply, Vitra, Mammut and Mollie, and built
    physical stores along the way.
  - |
    Open to new projects.
