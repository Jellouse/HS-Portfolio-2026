# Desktop arrow navigation.
# landing is the root. Each screen's parent id and dir place its button.
# Project galleries read the Gallery field on each project. Shop groups stay here.
landing:
  title: Humansize
  body: >-
    I partner with companies and artists to create their physical and digital
    presence.
  hint: Use arrow keys to navigate
nodes:
  - id: digital
    parent: landing
    dir: left
    label: Digital
    title: ""
    body: ""
    kind: branch
  - id: physical
    parent: landing
    dir: right
    label: Physical
    title: ""
    body: ""
    kind: branch
  - id: shop
    parent: landing
    dir: up
    label: Shop
    title: Shop
    kind: gallery
    groups:
      - title: Type-660
        product: "660"
        caption: >-
          A tall vase in solid aluminium, 200 mm high. Made for long stems like
          branches, lilies. Raw finish, 0.5 kg.
        images:
          - src: /src/content/products/660/overview/left/src.jpg
            alt: Type-660 tall aluminium vase
      - title: Type-120
        product: "120"
        caption: >-
          An aluminium vase made from one textured extrusion profile, for a
          medium-sized bouquet.
        images:
          - src: /src/content/products/120/overview/left/src.jpg
            alt: Type-120 aluminium vase
      - title: Type-490
        product: "490"
        caption: >-
          A heavy aluminium ring vase for a large bouquet, or for branches that
          need a strong base.
        images:
          - src: /src/content/products/490/overview/left/src.jpg
            alt: Type-490 aluminium ring vase
  - id: about
    parent: landing
    dir: down
    label: About
    title: ""
    body: ""
    kind: branch
  - id: web
    parent: digital
    dir: left
    label: Web
    title: Web
    kind: gallery
  - id: renders
    parent: digital
    dir: right
    label: 3D
    title: 3D
    kind: gallery
  - id: product
    parent: physical
    dir: left
    label: Product
    title: Product
    kind: gallery
  - id: retail
    parent: physical
    dir: right
    label: Retail
    title: Retail
    kind: gallery
