title: Conway & Co
published: false
summary: Conway & Co is a consultancy firm specialised in helping businesses create
  a smart and up to date technological backbone for their company. We've communicated
  this in the branding as well as the website using simple shapes and strong colours,
  as well as Helvetica as a typeface. These elements combined make for a visually
  pleasing identity while also communicating Conway & Co's essential values.
