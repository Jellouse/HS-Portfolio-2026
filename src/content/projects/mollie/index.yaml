title: Mollie
published: false
summary: This is when I first heard the word "unicorn" and what it meant in a business
  setting. A company worth over 1 billion dollars. With this kind of scale comes also
  the need for bigger offices. Mollie rented out a large space in a classic canal-side
  building and was then looking for someone to help them with the wayfinding. This
  project went from concept to final production and taught me a lot. How many times
  do you check print files? One more time.
