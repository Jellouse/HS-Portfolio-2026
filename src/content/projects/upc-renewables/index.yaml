title: UPC Renewables
published: false
summary: '"Coal" is used in Germany as slang for "Money".. Not with these guys! The
  future is renewable and they know it. UPC Renewables is a global company with a
  focus on bringing renewables to rural regions in Asia. Where the impact on human
  lives is immediate and the most important. We reflected their spirit for adventure
  in their brand identity and website.'
