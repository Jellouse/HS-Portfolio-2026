title: Industrial Bloom
year: 2026
published: true
summary: >-
  Industrial Bloom is a series of aluminium vases, handmade by Johann
  Schnettker in Germany with laser cutting, 3D printing and embossing.
  Currently in prototyping. Available at [worksurface.co](https://worksurface.co).
