title: Collaborating with Bodil Ouédraogo
year: 2023
yearEnd: 2026
published: true
summary: >-
  Since 2022, I have been collaborating with Bodil to work with 3D scans of
  ancient sculptures. We isolate parts turn them into totally new bodies, give
  them new meaning..
