title: Collaborating with Bodil Ouédraogo
year: 2023
yearEnd: 2026
published: true
summary: >-
  Since 2023 I've worked with Amsterdam artist [Bodil
  Ouédraogo](https://www.bodilouedraogo.com/) on the 3D side of her sculptures.
  She works from 3D scans of West African wooden figures from the collection of
  her father, Mamadou Ouédraogo. I prepare the files that turn those scans into
  new pieces. Most get 3D printed, and some are cast in concrete.


  Her work has been shown at
  [UNFAIR23](https://www.bodilouedraogo.com/framed-intimacy-01) in Amsterdam,
  the [15th Gwangju Biennale](https://www.bodilouedraogo.com/framed-intimacy-),
  [Art Rotterdam and the Stedelijk Museum
  Amsterdam](https://www.bodilouedraogo.com/framed-intimacy-noun), and most
  recently the [Rijksakademie Open Studios
  2026](https://rijksakademie.nl/en/open-studios/2026/bodil-ouedraogo).
rounded: true
