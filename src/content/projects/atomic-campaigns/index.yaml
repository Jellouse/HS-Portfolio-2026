      frame: default
      flush: false
  - discriminant: text
    value:
      heading: See better, Ski better
      text: >-
        Our prooving ground with Atomic - Our first campaign together targeting
        their new lineup of ski goggles. I've designed several key visuals and
        rendered the goggles in their best light. Together we've produced a
        landingpage completed with delightful animations and the sharpest
        visuals to highlight their new goggles.
