title: Conversation Design Institute
published: false
summary: Everybody scream! AI, AI, AI! But whenever I have to talk with an AI chatbot
  I actually think, NO! NO! NO! And try to get through to an actual human. CDI is
  here to change that. Just like I design websites, they design conversations. There's
  so much to cover in this field I didn't even know existed! We took a step back and
  thought about how to visualise a dynamic and delightful conversation.
