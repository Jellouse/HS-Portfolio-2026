      text: |
        The build is aluminium extrusion. Three vitrines roll. The panelling is stainless steel, and the worksurface is glass.

        Cameras sit in backlit milk glass. The gallery room suspends photographs from steel cables. Hundreds of 3D-printed parts are in the build.
