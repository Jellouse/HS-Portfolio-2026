title: Stellar Development
published: false
summary: Stellar Development is renting out a sustainably interconnected system of
  warehouses and logistic centers. The company is focussed on sustainable practices
  as well as efficiency. The brand identity was based on flocks of birds and fish
  building a system greater than the sum of its parts.
