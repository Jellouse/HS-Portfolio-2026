    value:
      left: /src/content/projects/analogue-couters/blocks/11/value/left.jpg
      right: /src/content/projects/analogue-couters/blocks/11/value/right.jpg
  - discriminant: text
    value:
      text: >-
        The second room gives back to the photographers who shoot with these
        cameras. It's a gallery of extrusion, steel cables and 3D printed parts
        that holds their prints in mid-air.
