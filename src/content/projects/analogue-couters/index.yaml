  - discriminant: image
    value:
      src: /src/content/projects/analogue-couters/blocks/5/value/src.png
      frame: full
      flush: false
  - discriminant: text
    value:
      text: >-
        I took it from CAD to finished counters. Every connection and tolerance
        was worked out before the parts were ordered. Then came hundreds of 3D
        printed pieces, countless tapped holes, and plenty of taking things
        apart and putting them back together. Extrusion is unforgiving, and
        everything has to go together in exactly the right order.
  - discriminant: image
    value:
      src: /src/content/projects/analogue-couters/blocks/7/value/src.jpg
      frame: full
      flush: false
  - discriminant: image
    value:
