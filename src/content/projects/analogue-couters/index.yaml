title: Analogue Store
caption: Analogue, 2025
year: 2025
order: 3
published: true
summary: >-
  A new store for Analogue Amsterdam on the Zeedijk, built entirely from
  aluminium extrusion.
coverVideo: /media/projects/analogue-couters/coverVideo.mp4
coverAlt: Analogue store on Zeedijk in Amsterdam
coverFrame: wide
coverFlush: false
rounded: true
info:
  - label: Ralisation
    value: Johann Schnettker
  - label: Year
    value: '2025'
  - label: Client
    value: '[Analogue](analogueshop.com)'
  - label: Place
    value: Zeedijk, Amsterdam
blocks:
  - discriminant: text
    value:
      text: >-
        At its centre are three large rolling vitrines with stainless steel
        panelling, a glass worksurface and backlit milk glass, so the cameras
        sit in the best possible light.
  - discriminant: image
    value:
      src: /src/content/projects/analogue-couters/blocks/1/value/src.png
      alt: Analogue store on Zeedijk in Amsterdam
      frame: wide
      flush: false
  - discriminant: image
    value:
      src: /src/content/projects/analogue-couters/blocks/2/value/src.png
      frame: full
      flush: false
  - discriminant: image
