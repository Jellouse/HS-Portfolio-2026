subline: Websites and 3D work you can click through and look at, designed and built in Framer and 3D.
intro: >-
  I design and build websites in Framer and 3D renders that show a product or space before it exists. Most projects combine both, from a launch site to the visuals that sell the idea.
processHeading: How a project runs
processSteps:
  - title: Brief
    body: We align on goals, audience and what needs to ship first.
  - title: Design
    body: I design in Framer or 3D, iterating in the tool you will ship or present from.
  - title: Build
    body: I build the site, renders or both, and tie them to your brand system.
  - title: Launch
    body: I hand over a live site, export kit or render set ready for your team.
